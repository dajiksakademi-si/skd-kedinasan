<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviu Soal D'Ajiks</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16233f; --navy-2:#24365e; --gold:#b88a2e; --gold-soft:#f4ead3;
  --bg:#f3f4f7; --surface:#ffffff; --line:#dde1ea; --ink:#18202f; --ink-2:#4b5568;
  --ok:#2f7a53; --ok-soft:#e3f2e9; --warn:#a8661a; --warn-soft:#fbeedb; --bad:#b03a3a; --bad-soft:#f8e3e3;
  --ease:cubic-bezier(.23,1,.32,1); --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1524; --surface:#172036; --line:#2a3550; --ink:#e8ebf2; --ink-2:#a7b0c3;
  --gold-soft:#3a3018; --ok:#74d39c; --warn:#eeb065; --bad:#f08a8a; --ok-soft:#173326; --warn-soft:#3a2a14; --bad-soft:#3a1c1c; --navy-2:#c9d3ea;
}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
::selection{background:var(--gold-soft)}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 24px;background:var(--navy);color:#fff}
header img{width:36px;height:36px;border-radius:8px;background:#fff}
header h1{font-size:1.05rem;font-weight:700;margin:0;margin-right:auto;letter-spacing:-.01em}
header label{font-size:.8rem;opacity:.75;display:flex;flex-direction:column;gap:2px}
header select{background:var(--navy-2);color:#fff;border:1px solid #ffffff33;border-radius:8px;padding:6px 10px}
@media (prefers-color-scheme:dark){header select{background:#24365e}}
.progres{font-size:.9rem;font-variant-numeric:tabular-nums;opacity:.9}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform 160ms var(--ease),background-color 160ms ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn-gold{background:var(--gold);color:#16233f}
.btn-gold:hover{background:#c99a3c}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}

main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:24px}
@media (max-width:820px){main{grid-template-columns:1fr;padding:16px}}

aside{display:flex;flex-direction:column;gap:20px}
aside h2{font-size:.85rem;font-weight:600;color:var(--ink-2);margin:0 0 8px}
.grid-no{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid-no button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;
  font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;transition:transform 120ms var(--ease)}
.grid-no button:active{transform:scale(.94)}
.grid-no button.sesuai{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid-no button.perbaikan{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.grid-no button.keliru{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid-no button.aktif{outline:2px solid var(--navy-2);outline-offset:1px}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--ink-2);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);line-height:1.5}
textarea::placeholder{color:var(--ink-2);opacity:.8}

.kartu{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 32px;box-shadow:0 2px 10px #16233f0d}
@media (max-width:820px){.kartu{padding:20px}}
.kepala{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.kepala h2{margin:0;font-size:1.3rem;letter-spacing:-.015em}
.ranah{font-size:.85rem;color:var(--ink-2)}
.soal{font-size:1.1rem;max-width:68ch;margin:0 0 20px}
.petunjuk{font-size:.88rem;color:var(--ink-2);margin:0 0 10px}
.opsi{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opsi button{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;text-align:left;
  border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:12px 14px;cursor:pointer;
  transition:border-color 160ms ease,background-color 160ms ease,transform 120ms var(--ease)}
.opsi button:hover{border-color:var(--navy-2)}
.opsi button:active{transform:scale(.99)}
.huruf{font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:.9rem}
.nilai{font-weight:700;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center;padding:2px 8px;border-radius:6px;background:var(--bg);
  opacity:0;transform:translateY(2px);transition:opacity 200ms ease,transform 200ms var(--ease)}
.terbuka .nilai{opacity:1;transform:none}
.opsi button.dipilih{border-color:var(--navy-2);background:var(--bg)}
.terbuka .opsi button.kunci{border-color:var(--gold);background:var(--gold-soft)}
.terbuka .opsi button.kunci .huruf{background:var(--gold);color:#16233f}
.banding{font-size:.92rem;padding:10px 14px;border-radius:8px;margin:0 0 4px;display:none}
.terbuka .banding{display:block}
.banding.sama{background:var(--ok-soft);color:var(--ok)}
.banding.beda{background:var(--bad-soft);color:var(--bad)}
.lewati{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.88rem}
.terbuka .lewati{display:none}

.penilaian{border-top:1px solid var(--line);margin-top:24px;padding-top:20px;display:grid;gap:16px}
.penilaian h3{margin:0;font-size:1rem}
.status{display:flex;flex-wrap:wrap;gap:8px}
.status button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:.92rem;
  transition:background-color 160ms ease,border-color 160ms ease,transform 120ms var(--ease)}
.status button:active{transform:scale(.97)}
.status button[aria-pressed=true][data-s=sesuai]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.status button[aria-pressed=true][data-s=perbaikan]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.status button[aria-pressed=true][data-s=keliru]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.isian{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.isian{grid-template-columns:1fr}}
.isian label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}

.navigasi{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.simpan{font-size:.85rem;color:var(--ink-2)}
.pesan{max-width:1180px;margin:16px auto 0;padding:0 24px}
.pesan div{padding:12px 16px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.pesan div.ok{background:var(--ok-soft);color:var(--ok)}
.kosong{padding:48px;text-align:center;color:var(--ink-2)}
@media (max-width:820px){.grid-no{grid-template-columns:repeat(9,1fr)}.grid-no button{font-size:.75rem}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <h1>Reviu Soal D'Ajiks</h1>
  <label>Paket<select id="pilihPaket"></select></label>
  <label>Pengoreksi<select id="pilihReviewer"></select></label>
  <span class="progres" id="progres"></span>
  <button class="btn btn-gold" id="kirim">Kirim ke Gusti</button>
</header>
<div class="pesan" id="pesan" hidden></div>
<main>
  <aside>
    <section>
      <h2>Nomor soal</h2>
      <div class="grid-no" id="gridNo"></div>
      <div class="legenda"><span><i style="background:var(--ok)"></i>Sesuai</span><span><i style="background:var(--warn)"></i>Perlu perbaikan</span><span><i style="background:var(--bad)"></i>Kunci keliru</span></div>
    </section>
    <section>
      <h2><label for="catatanUmum">Catatan umum paket</label></h2>
      <textarea id="catatanUmum" placeholder="Kesan keseluruhan, pola masalah yang berulang, dan sebagainya."></textarea>
    </section>
  </aside>
  <section>
    <div class="kartu" id="kartu"><div class="kosong">Memuat soal…</div></div>
    <div class="navigasi">
      <button class="btn btn-ghost" id="sebelum">Sebelumnya</button>
      <span class="simpan" id="simpan"></span>
      <button class="btn btn-ghost" id="berikut">Berikutnya</button>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const S = { paket: '', reviewer: '', soal: [], hasil: { soal: {}, catatanUmum: '' }, i: 0 };
const ingat = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; };
const LABEL = { sesuai: 'Sesuai', perbaikan: 'Perlu perbaikan', keliru: 'Kunci keliru' };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

async function api(p, body) {
  const q = `paket=${encodeURIComponent(S.paket)}&reviewer=${encodeURIComponent(S.reviewer)}`;
  const r = await fetch(`/api/${p}${p === 'daftar' ? '' : '?' + q}`, body ? { method: 'POST', body: JSON.stringify(body) } : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.galat || 'Gagal');
  return d;
}

function pesan(t, ok) {
  $('pesan').hidden = !t;
  $('pesan').innerHTML = t ? `<div class="${ok ? 'ok' : ''}">${esc(t)}</div>` : '';
}

const rec = (n) => (S.hasil.soal[n] ||= {});

let tunda;
function simpan() {
  $('simpan').textContent = 'Menyimpan…';
  clearTimeout(tunda);
  tunda = setTimeout(async () => {
    try { await api('simpan', S.hasil); $('simpan').textContent = 'Tersimpan di komputer'; }
    catch (e) { $('simpan').textContent = 'Gagal menyimpan: ' + e.message; }
  }, 500);
}

function progres() {
  const n = S.soal.filter((s) => S.hasil.soal[s.n]?.status).length;
  $('progres').textContent = `${n} dari ${S.soal.length} diperiksa`;
  $('gridNo').innerHTML = S.soal.map((s, k) =>
    `<button class="${S.hasil.soal[s.n]?.status || ''} ${k === S.i ? 'aktif' : ''}" data-k="${k}" aria-label="Soal ${s.n}">${s.n}</button>`).join('');
}

function tampil() {
  const s = S.soal[S.i]; if (!s) return;
  const r = rec(s.n);
  const terbuka = r.pilihan || r.lihatKunci;
  $('kartu').className = 'kartu' + (terbuka ? ' terbuka' : '');
  $('kartu').innerHTML = `
    <div class="kepala"><h2>Soal ${s.n}</h2><span class="ranah">${esc(s.ranah)}</span></div>
    <p class="soal">${esc(s.soal)}</p>
    <p class="petunjuk">${terbuka ? 'Nilai tiap opsi menurut kunci penyusun.' : 'Pilih jawaban terbaik menurut Bapak dulu. Nilai dan kunci muncul sesudahnya.'}</p>
    <div class="opsi">${Object.entries(s.opsi).map(([h, t]) => `
      <button data-h="${h}" class="${h === s.kunci ? 'kunci' : ''} ${h === r.pilihan ? 'dipilih' : ''}">
        <span class="huruf">${h}</span><span>${esc(t)}</span><span class="nilai">${s.nilai[h] ?? ''}</span>
      </button>`).join('')}</div>
    ${r.pilihan ? `<p class="banding ${r.pilihan === s.kunci ? 'sama' : 'beda'}">${r.pilihan === s.kunci
      ? `Pilihan Bapak sama dengan kunci (${s.kunci}).`
      : `Pilihan Bapak ${r.pilihan}, kunci penyusun ${s.kunci}. Mohon tulis alasannya di bawah.`}</p>` : ''}
    <button class="lewati" id="lihatKunci">Lihat kunci tanpa memilih</button>
    <div class="penilaian">
      <h3>Penilaian Bapak</h3>
      <div class="status">${Object.entries(LABEL).map(([k, v]) =>
        `<button data-s="${k}" aria-pressed="${r.status === k}">${v}</button>`).join('')}</div>
      <div class="isian">
        <label>Masalahnya<textarea data-f="masalah" placeholder="Contoh: opsi C juga bisa dianggap paling tepat karena …">${esc(r.masalah || '')}</textarea></label>
        <label>Usulan perbaikan<textarea data-f="usulan" placeholder="Contoh: opsi C diganti menjadi …">${esc(r.usulan || '')}</textarea></label>
      </div>
    </div>`;
  $('sebelum').disabled = S.i === 0;
  $('berikut').disabled = S.i === S.soal.length - 1;
  progres();
}

$('kartu').addEventListener('click', (e) => {
  const s = S.soal[S.i], r = rec(s.n);
  const o = e.target.closest('[data-h]'), st = e.target.closest('[data-s]');
  if (o) r.pilihan = o.dataset.h;
  else if (st) r.status = r.status === st.dataset.s ? undefined : st.dataset.s;
  else if (e.target.id === 'lihatKunci') r.lihatKunci = true;
  else return;
  simpan(); tampil();
});
$('kartu').addEventListener('input', (e) => {
  const f = e.target.dataset.f; if (!f) return;
  rec(S.soal[S.i].n)[f] = e.target.value; simpan();
});
$('catatanUmum').addEventListener('input', (e) => { S.hasil.catatanUmum = e.target.value; simpan(); });
$('gridNo').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { S.i = +b.dataset.k; tampil(); } });
$('sebelum').onclick = () => { S.i--; tampil(); scrollTo({ top: 0 }); };
$('berikut').onclick = () => { S.i++; tampil(); scrollTo({ top: 0 }); };
document.addEventListener('keydown', (e) => {
  if (e.target.matches('textarea,select')) return;
  if (e.key === 'ArrowRight' && S.i < S.soal.length - 1) $('berikut').click();
  if (e.key === 'ArrowLeft' && S.i > 0) $('sebelum').click();
});

async function muat() {
  pesan('');
  ingat('paket', S.paket); ingat('reviewer', S.reviewer);
  $('kartu').innerHTML = '<div class="kosong">Memuat soal…</div>';
  try {
    const d = await api('paket');
    S.soal = d.soal; S.hasil = d.hasil; S.i = 0;
    $('catatanUmum').value = S.hasil.catatanUmum || '';
    $('simpan').textContent = '';
    tampil();
  } catch (e) { $('kartu').innerHTML = `<div class="kosong">${esc(e.message)}</div>`; }
}

$('kirim').onclick = async () => {
  const sisa = S.soal.length - S.soal.filter((s) => S.hasil.soal[s.n]?.status).length;
  if (!confirm(sisa ? `Masih ${sisa} soal belum dinilai. Tetap kirim hasil sejauh ini ke Gusti?` : 'Kirim hasil reviu ke Gusti?')) return;
  $('kirim').disabled = true; $('kirim').textContent = 'Mengirim…';
  try {
    clearTimeout(tunda); await api('simpan', S.hasil);
    const d = await api('kirim', {});
    pesan(`Terkirim. ${d.diperiksa} soal diperiksa, ${d.masalah} perlu tindak lanjut. Gusti sudah bisa melihatnya.`, true);
  } catch (e) {
    pesan('Pengiriman gagal. Hasil tetap tersimpan di komputer Bapak. Kirim tangkapan layar pesan ini ke Gusti: ' + e.message);
  }
  $('kirim').disabled = false; $('kirim').textContent = 'Kirim ke Gusti';
};

(async () => {
  try {
    const d = await api('daftar');
    $('pilihPaket').innerHTML = d.paket.map((p) => `<option value="${p.id}">${esc(p.judul)}</option>`).join('');
    $('pilihReviewer').innerHTML = d.reviewer.map((r) => `<option>${esc(r)}</option>`).join('');
    const p = ingat('paket'), r = ingat('reviewer');
    if (d.paket.some((x) => x.id === p)) $('pilihPaket').value = p;
    $('pilihReviewer').value = d.reviewer.includes(r) ? r : (d.reviewer.includes('AcademyBRIJ') ? 'AcademyBRIJ' : d.reviewer[0]);
    S.paket = $('pilihPaket').value; S.reviewer = $('pilihReviewer').value;
    $('pilihPaket').onchange = (e) => { S.paket = e.target.value; muat(); };
    $('pilihReviewer').onchange = (e) => { S.reviewer = e.target.value; muat(); };
    muat();
  } catch (e) { pesan('Tidak bisa terhubung ke server reviu. Pastikan perintah npm run reviu masih berjalan.'); }
})();
</script>
</body>
</html>
